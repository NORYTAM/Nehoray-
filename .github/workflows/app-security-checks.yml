name: App and security checks

on:
  push:
    branches:
      - main
      - security/privacy-state-hardening
  pull_request:
    branches:
      - main
      - security/privacy-state-hardening

permissions:
  contents: read

jobs:
  app:
    name: TypeScript, lint and web export
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security report
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); const rows=Object.entries(a.vulnerabilities || {}).map(([name,v]) => ({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:(v.via || []).map(x => typeof x === "string" ? x : x.title)})); console.log(JSON.stringify({summary:a.metadata?.vulnerabilities, vulnerabilities:rows}, null, 2));'

      - name: Type-check application
        env:
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-anon-key
        run: npx tsc --noEmit

      - name: Lint security and workflow files
        env:
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-anon-key
        run: |
          npx eslint \
            app/admin/_layout.tsx \
            app/profile-details.tsx \
            components/EngagementButton.tsx \
            hooks/useHomeProfiles.ts \
            lib/engagementService.ts \
            lib/fieldLabels.ts \
            lib/infoRequestService.ts \
            lib/introService.ts \
            lib/notificationService.ts \
            lib/profileService.ts \
            lib/suggestionService.ts \
            --rule 'react-hooks/set-state-in-effect: off'

      - name: Export web app
        env:
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-anon-key
        run: npx expo export --platform web --output-dir dist


  sql-grammar:
    name: Parse Supabase migration SQL
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL parser
        run: pip install pglast
      - name: Parse migration SQL
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          files = sorted(Path("supabase/migrations").glob("*.sql"))
          if not files:
              raise SystemExit("No Supabase migrations found")
          for path in files:
              sql = path.read_text()
              # The PostgreSQL parser validates the migration statement grammar.
              parse_sql(sql)
              print(f"SQL grammar OK: {path}")
          PY

  edge-functions:
    name: Check Supabase Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        run: |
          deno check --node-modules-dir=auto --no-lock supabase/functions/send-notification/index.ts
          deno check --no-lock supabase/functions/send-announcement/index.ts
          deno check --no-lock supabase/functions/resend-webhook/index.ts
