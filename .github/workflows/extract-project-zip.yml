name: Extract project ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract project archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP="shiduch-app-master.zip"
          test -f "$ZIP" || { echo "Missing $ZIP"; exit 1; }
          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"
          SOURCE="$TMP/shiduch-app-master"
          test -f "$SOURCE/package.json" || { echo "Project root not found in ZIP"; exit 1; }
          rsync -a --exclude='.git/' --exclude='node_modules/' --exclude='.env' --exclude='.env.*' "$SOURCE/" ./
          rm -rf "$TMP"
      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes."
          else
            git commit -m "Extract project source from ZIP"
            git push
          fi
